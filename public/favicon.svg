<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0E0A07"/>

  <!-- Subtle amber ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#D4891A" stroke-width="1" opacity="0.45"/>

  <!-- Letter M (x: 2.5–14, y: 8–24) drawn as a filled path -->
  <path
    d="M 2.5,24 L 2.5,8 L 5,8 L 8.25,14.5 L 11.5,8 L 14,8 L 14,24 L 11.5,24 L 11.5,13.5 L 8.25,19.5 L 5,13.5 L 5,24 Z"
    fill="#D4891A"
  />

  <!-- Letter E (x: 17–29, y: 8–24) drawn as three rects + left bar -->
  <!-- Left vertical bar -->
  <rect x="17" y="8" width="2.5" height="16" fill="#D4891A"/>
  <!-- Top bar -->
  <rect x="17" y="8" width="12" height="2.5" fill="#D4891A"/>
  <!-- Middle bar (slightly shorter) -->
  <rect x="17" y="14.75" width="8.5" height="2.5" fill="#D4891A"/>
  <!-- Bottom bar -->
  <rect x="17" y="21.5" width="12" height="2.5" fill="#D4891A"/>
</svg>
